name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  core-windows:
    name: Core / Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run standard-library unit suites
        id: unit_suites
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $externalCwd = Join-Path ([System.IO.Path]::GetTempPath()) ("skill-hub-tests-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $externalCwd | Out-Null
          $beforeStatus = (& git -C $repoRoot status --porcelain=v1 --untracked-files=all) -join "`n"
          $env:PYTHONPATH = ''
          $env:PYTHONNOUSERSITE = '1'
          $env:PYTHONHASHSEED = '0'
          $suites = @(
            (Join-Path $repoRoot '10-paper-build\latex-paper-build-skill\tests'),
            (Join-Path $repoRoot '20-project-build\experiment-protocol-audit\tests'),
            (Join-Path $repoRoot '20-project-build\project-agent-generator-skill\tests'),
            (Join-Path $repoRoot '20-project-build\research-management-pipeline\tests'),
            (Join-Path $repoRoot '20-project-build\research-project-pipeline\tests'),
            (Join-Path $repoRoot '20-project-build\research-workspace-governance\tests'),
            (Join-Path $repoRoot '50-core-utils\neat-freak\tests'),
            (Join-Path $repoRoot '50-core-utils\skill-registry\tests')
          )
          $failedSuites = @()
          Push-Location $externalCwd
          try {
            foreach ($iteration in 1..2) {
              foreach ($suite in $suites) {
                python -X utf8 -B -m unittest discover -s $suite -p 'test_*.py'
                if ($LASTEXITCODE -ne 0) { $failedSuites += "iteration-$iteration`:$suite" }
              }
            }
          } finally {
            Pop-Location
          }
          $afterStatus = (& git -C $repoRoot status --porcelain=v1 --untracked-files=all) -join "`n"
          if ($afterStatus -ne $beforeStatus) { throw 'Unit suites changed the repository worktree' }
          if ($failedSuites.Count -gt 0) {
            Write-Host "Failed unit suites: $($failedSuites -join ', ')"
            exit 1
          }

      - name: Run Reader-Learner smoke tests
        id: reader_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = Get-ChildItem '.\50-core-utils\skill-registry\sources\reader-learner\tests' -Filter 'test_*.py' | Sort-Object Name
          $failedTests = @()
          foreach ($test in $tests) {
            python -X utf8 -B $test.FullName
            if ($LASTEXITCODE -ne 0) { $failedTests += $test.Name }
          }
          if ($failedTests.Count -gt 0) {
            Write-Host "Failed Reader-Learner tests: $($failedTests -join ', ')"
            exit 1
          }

      - name: Validate registry and project knowledge
        id: registry_knowledge
        continue-on-error: true
        shell: pwsh
        run: |
          $failedChecks = @()
          python -X utf8 -B '.\50-core-utils\skill-registry\tools\skill_registry.py' registry-check --registry '.\50-core-utils\skill-registry'
          if ($LASTEXITCODE -ne 0) { $failedChecks += 'skill-registry' }
          python -X utf8 -B '.\50-core-utils\neat-freak\scripts\manage_project_knowledge.py' '.' audit
          if ($LASTEXITCODE -ne 0) { $failedChecks += 'neat-freak' }
          if ($failedChecks.Count -gt 0) {
            Write-Host "Failed validation checks: $($failedChecks -join ', ')"
            exit 1
          }

      - name: Check repository integrity
        id: repository_integrity
        continue-on-error: true
        shell: pwsh
        env:
          CI_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'

          $categories = @('10-paper-build', '20-project-build', '30-papertrace', '40-skill-registry', '50-core-utils', '90-personal', '98-inbox', '99-archive')
          foreach ($category in $categories) {
            foreach ($name in @('README.md', 'README.en.md')) {
              $path = Join-Path $category $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing category README: $path" }
            }
          }

          $active = @()
          foreach ($category in @('10-paper-build', '20-project-build', '90-personal')) {
            $active += Get-ChildItem $category -Directory | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'SKILL.md') }
          }
          $active += Get-ChildItem '50-core-utils' -Directory | Where-Object {
            $_.Name -ne 'skill-registry' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'SKILL.md'))
          }
          if ($active.Count -ne 20) { throw "Expected 20 active Skills, found $($active.Count)" }

          $rootReadmes = (Get-Content -Raw 'README.md') + "`n" + (Get-Content -Raw 'README.en.md')
          foreach ($skill in $active) {
            $skillDocument = Get-Content -Raw (Join-Path $skill.FullName 'SKILL.md')
            $nameMatch = [regex]::Match($skillDocument, '(?m)^name:\s*([^\s]+)\s*$')
            if (-not $nameMatch.Success) { throw "Skill has no frontmatter name: $($skill.FullName)" }
            $skillName = $nameMatch.Groups[1].Value
            if ($rootReadmes -notmatch [regex]::Escape("``$skillName``")) {
              throw "Root READMEs do not index active Skill: $skillName"
            }
          }

          foreach ($path in @('98-inbox/README.md', '98-inbox/README.en.md', '99-archive/README.md', '99-archive/README.en.md')) {
            git ls-files --error-unmatch -- $path | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Expected tracked navigation README: $path" }
          }

          $navigation = Get-Content -Raw '30-papertrace/README.md', '30-papertrace/README.en.md', '40-skill-registry/README.md', '40-skill-registry/README.en.md'
          if (($navigation -join "`n") -match '(?i)[a-z]:\\') { throw 'Navigation READMEs expose a machine-local absolute path' }

          $readmes = @('README.md', 'README.en.md')
          foreach ($category in $categories) {
            $readmes += Join-Path $category 'README.md'
            $readmes += Join-Path $category 'README.en.md'
          }
          $linkPattern = '\[[^\]]+\]\(([^)]+)\)'
          foreach ($readme in $readmes) {
            $base = Split-Path -Parent $readme
            if (-not $base) { $base = '.' }
            foreach ($match in [regex]::Matches((Get-Content -Raw $readme), $linkPattern)) {
              $target = $match.Groups[1].Value.Trim().Trim('<', '>')
              if ($target -match '^(?i:https?://|mailto:|#)') { continue }
              $target = ($target -split '#', 2)[0]
              if (-not $target) { continue }
              $resolved = Join-Path $base ([uri]::UnescapeDataString($target))
              if (-not (Test-Path -LiteralPath $resolved)) { throw "Broken README link: $readme -> $target" }
            }
          }

          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:GITHUB_BASE_REF) {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } elseif ($env:CI_BEFORE_SHA -match '^[0-9a-f]{40}$' -and $env:CI_BEFORE_SHA -notmatch '^0+$') {
            git diff --check "$env:CI_BEFORE_SHA..HEAD"
          } else {
            git show --check --format= --no-ext-diff HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce required Windows checks
        if: ${{ always() }}
        shell: pwsh
        env:
          UNIT_SUITES_OUTCOME: ${{ steps.unit_suites.outcome }}
          READER_SMOKE_OUTCOME: ${{ steps.reader_smoke.outcome }}
          REGISTRY_KNOWLEDGE_OUTCOME: ${{ steps.registry_knowledge.outcome }}
          REPOSITORY_INTEGRITY_OUTCOME: ${{ steps.repository_integrity.outcome }}
        run: |
          $outcomes = [ordered]@{
            'unit-suites' = $env:UNIT_SUITES_OUTCOME
            'reader-smoke' = $env:READER_SMOKE_OUTCOME
            'registry-knowledge' = $env:REGISTRY_KNOWLEDGE_OUTCOME
            'repository-integrity' = $env:REPOSITORY_INTEGRITY_OUTCOME
          }
          $failedChecks = @($outcomes.GetEnumerator() | Where-Object { $_.Value -ne 'success' })
          foreach ($check in $outcomes.GetEnumerator()) {
            Write-Host "$($check.Key): $($check.Value)"
          }
          if ($failedChecks.Count -gt 0) {
            Write-Host "Required Windows checks did not pass: $($failedChecks.Key -join ', ')"
            exit 1
          }

  compatibility-linux:
    name: Compatibility / Linux (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run cross-platform safety suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $externalCwd = Join-Path ([System.IO.Path]::GetTempPath()) ("skill-hub-linux-tests-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $externalCwd | Out-Null
          $beforeStatus = (& git -C $repoRoot status --porcelain=v1 --untracked-files=all) -join "`n"
          $env:PYTHONPATH = ''
          $env:PYTHONNOUSERSITE = '1'
          $env:PYTHONHASHSEED = '0'
          $projectSuites = Get-ChildItem (Join-Path $repoRoot '20-project-build') -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'tests') -PathType Container } |
            ForEach-Object { Join-Path $_.FullName 'tests' }
          $suites = @($projectSuites) + @((Join-Path $repoRoot '50-core-utils/skill-registry/tests'))
          $failedSuites = @()
          Push-Location $externalCwd
          try {
            foreach ($iteration in 1..2) {
              foreach ($suite in $suites) {
                python -X utf8 -B -m unittest discover -s $suite -p 'test_*.py'
                if ($LASTEXITCODE -ne 0) { $failedSuites += "iteration-$iteration`:$suite" }
              }
            }
            $readerTests = Get-ChildItem (Join-Path $repoRoot '50-core-utils/skill-registry/sources/reader-learner/tests') -Filter 'test_*.py' | Sort-Object Name
            foreach ($test in $readerTests) {
              python -X utf8 -B $test.FullName
              if ($LASTEXITCODE -ne 0) { $failedSuites += $test.FullName }
            }
          } finally {
            Pop-Location
          }
          $afterStatus = (& git -C $repoRoot status --porcelain=v1 --untracked-files=all) -join "`n"
          if ($afterStatus -ne $beforeStatus) { throw 'Compatibility suites changed the repository worktree' }
          if ($failedSuites.Count -gt 0) {
            Write-Host "Failed compatibility suites: $($failedSuites -join ', ')"
            exit 1
          }

  secret-scan:
    name: Security / Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
